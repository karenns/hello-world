name: Onboarding to ABC
description: Request Access to ABC platform.
title: "[ABC Onboarding]: "
labels: ["onboarding","ABC"]
body:
  - type: markdown
    attributes:
      value: |
        Let's get you onboarded to our new XYZ platform!
  - type: input
    id: team-name
    attributes:
      label: Team's Name
      description: What's your team's name?
    validations:
      required: true
  - type: input
    id: team-id
    attributes:
      label: Team's ID
      description: What's your team's ID?
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: Contact Details
      description: What's your email address?
      placeholder: ex. email@example.com
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version would you like access?
      options:
        - 1.5 (latest)
        - 1.4
        - 1.3
        - 1.2
      default: 0
    validations:
      required: true
